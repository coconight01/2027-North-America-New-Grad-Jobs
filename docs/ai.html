<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 今日推荐 · 2027 Job Radar</title>
<style>
body{margin:0;background:#f6f7fb;color:#172033;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:#111827;color:white;border-radius:18px;padding:24px}.hero a{color:#c7d2fe}.meta{color:#cbd5e1;margin-top:8px}.grid{display:grid;gap:12px;margin-top:16px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.top{display:flex;justify-content:space-between;gap:12px}.company{font-weight:800}.role{font-size:17px;font-weight:750;margin:7px 0}.role a{color:#3146b5;text-decoration:none}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#eef2ff;border-radius:999px;padding:3px 8px;font-size:12px}.reason{margin-top:10px}.caveat{margin-top:7px;color:#9a3412}.empty{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:28px;text-align:center;color:#6b7280;margin-top:16px}.back{display:inline-block;margin-top:12px;margin-right:14px;text-decoration:none}.rank{font-weight:800;color:#7c3aed}
</style>
</head>
<body><main class="wrap"><section class="hero"><div>🤖 DAILY PERSONALIZED REVIEW</div><h1>AI 今日推荐</h1><div>这是每日基于候选人经历、岗位质量、身份、薪资、申请额度和时效做的个性化 shortlist；与机械筛选的完整职位库分开。</div><div class="meta" id="meta">正在读取今日推荐…</div><a class="back" href="./">← 返回职位雷达</a><a class="back" href="./tracker.html">📬 Application / Offer Tracker</a></section><section id="list"></section></main>
<script>
const URL='https://raw.githubusercontent.com/coconight01/2027-North-America-New-Grad-Jobs/main/data/ai_recommendations.json';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch(URL,{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('meta').textContent=(d.updated_at?'更新时间：'+d.updated_at:'尚未完成第一次每日 AI 审核')+(d.summary?' · '+d.summary:'');const a=d.recommendations||[];if(!a.length){document.getElementById('list').innerHTML='<div class="empty">第一次每日个性化审核完成后，这里会出现当天最值得投的岗位。</div>';return;}document.getElementById('list').innerHTML='<div class="grid">'+a.map((x,i)=>`<article class="card"><div class="top"><div><span class="rank">#${esc(x.rank||i+1)}</span> <span class="company">${esc(x.company||'')}</span></div><div>${esc(x.urgency||'')}</div></div><div class="role"><a target="_blank" rel="noopener" href="${esc(x.url||'#')}">${esc(x.role||'')}</a></div><div class="tags">${[x.location,x.salary,x.fit,x.new_grad,x.sponsorship].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${x.reason?`<div class="reason"><b>为什么值得投：</b>${esc(x.reason)}</div>`:''}${x.caveat?`<div class="caveat"><b>注意：</b>${esc(x.caveat)}</div>`:''}${x.application_limit?`<div class="caveat"><b>申请额度：</b>${esc(x.application_limit)}</div>`:''}</article>`).join('')+'</div>';}).catch(e=>{document.getElementById('meta').textContent='读取失败：'+e.message;});
</script></body></html>
