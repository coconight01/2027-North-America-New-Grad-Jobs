<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 今日推荐 · 2027 Job Radar</title>
<style>
body{margin:0;background:#f6f7fb;color:#172033;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:#111827;color:white;border-radius:18px;padding:24px}.hero a{color:#c7d2fe}.meta{color:#cbd5e1;margin-top:8px}.section{margin-top:28px}.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px}.section h2{margin:0;font-size:21px}.section-note{color:#64748b}.grid{display:grid;gap:12px;margin-top:12px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:16px}.priority .card{border-left:5px solid #7c3aed}.stretch .card{border-left:5px solid #2563eb}.review .card{border-left:5px solid #d97706}.hold .card{border-left:5px solid #64748b}.top{display:flex;justify-content:space-between;gap:12px}.company{font-weight:800}.role{font-size:17px;font-weight:750;margin:7px 0}.role a{color:#3146b5;text-decoration:none}.tags{display:flex;gap:7px;flex-wrap:wrap}.tag{background:#eef2ff;border-radius:999px;padding:3px 8px;font-size:12px}.detail{margin-top:8px}.detail b{color:#334155}.caveat{margin-top:8px;color:#9a3412}.empty{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:28px;text-align:center;color:#6b7280;margin-top:16px}.back{display:inline-block;margin-top:12px;margin-right:14px;text-decoration:none}.rank{font-weight:800;color:#7c3aed}@media(max-width:640px){.wrap{padding:14px}.hero{padding:18px}.section-head{display:block}.section-note{margin-top:4px}}
</style>
</head>
<body><main class="wrap"><section class="hero"><div>🤖 DAILY PERSONALIZED REVIEW</div><h1>AI 今日推荐</h1><div>高信号、广覆盖的人工复核视图：把明确可投、次优选择、frontier stretch、待核验和暂缓岗位分开，机械候选池仍完整保留。</div><div class="meta" id="meta">正在读取今日推荐…</div><a class="back" href="./">← 返回职位雷达</a><a class="back" href="./tracker.html">📬 Application / Offer Tracker</a></section><section id="list"></section></main>
<script>
const URL='https://raw.githubusercontent.com/coconight01/2027-North-America-New-Grad-Jobs/main/data/ai_recommendations.json';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card=(x,i)=>`<article class="card"><div class="top"><div><span class="rank">#${esc(x.rank||i+1)}</span> <span class="company">${esc(x.company||'')}</span></div><div>${esc(x.urgency||x.status||'')}</div></div><div class="role">${x.url?`<a target="_blank" rel="noopener" href="${esc(x.url)}">${esc(x.role||'')}</a>`:esc(x.role||'')}</div><div class="tags">${[x.fit_score,x.location,x.salary,x.fit].filter(Boolean).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${x.reason?`<div class="detail"><b>匹配依据：</b>${esc(x.reason)}</div>`:''}${x.new_grad?`<div class="detail"><b>最低门槛：</b>${esc(x.new_grad)}</div>`:''}${x.eligibility?`<div class="detail"><b>资格判断：</b>${esc(x.eligibility)}</div>`:''}${x.sponsorship?`<div class="detail"><b>签证：</b>${esc(x.sponsorship)}</div>`:''}${x.caveat?`<div class="caveat"><b>主要 caveat：</b>${esc(x.caveat)}</div>`:''}${x.application_limit?`<div class="detail"><b>投递/额度：</b>${esc(x.application_limit)}</div>`:''}${x.next_action?`<div class="detail"><b>下一步：</b>${esc(x.next_action)}</div>`:''}</article>`;
const section=(title,note,items,klass)=>items.length?`<section class="section ${klass}"><div class="section-head"><h2>${esc(title)}</h2><div class="section-note">${esc(note)} · ${items.length} 个</div></div><div class="grid">${items.map(card).join('')}</div></section>`:'';
fetch(URL,{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('meta').textContent=(d.updated_at?'更新时间：'+d.updated_at:'尚未完成第一次每日 AI 审核')+(d.summary?' · '+d.summary:'');const a=d.recommendations||[],priority=a.filter(x=>x.tier==='priority'),secondary=a.filter(x=>x.tier!=='priority');const html=[section('A · Priority Apply Now','当前最值得花申请时间',priority,'priority'),section('B · Worth Applying / Secondary','仍然值得投，但方向或门槛存在折损',secondary,'secondary'),section('C · High-Value Stretch','技术重合很高，early-career 筛选不确定',d.high_value_stretch||[],'stretch'),section('D · Review Only','签证、资格或官方页面证据不足',d.review_only||[],'review'),section('E · Watch / Hold','重要但目前不行动',d.watch_hold||[],'hold')].join('');document.getElementById('list').innerHTML=html||'<div class="empty">今日没有通过人工审核的岗位。</div>';}).catch(e=>{document.getElementById('meta').textContent='读取失败：'+e.message;});
</script></body></html>
