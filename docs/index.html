let jobs=[],aiUrls=new Set(),view="apply",visibleLimit=80,lang=localStorage.getItem("jobRadarLang")||"zh";

const roleKey=j=>norm(j.company)+"|"+norm(j.role);const inList=(c,l)=>l.some(x=>norm(x)===norm(c));function groupOf(c){if(inList(c,BD))return"bytedance";for(const k of["bigtech","infra","quant","value"])if(inList(c,GROUPS[k]))return k;return"other"}const isFeatured=j=>["bigtech","infra","quant","value"].includes(groupOf(j.company)),posted=j=>j.posted_date||j.date_added||"0000-00-00",phd=j=>String(j.phd_required||"").toLowerCase()==="yes",salaryMax=j=>num(j.salary_max_annual),ngRank=j=>({Confirmed:0,Likely:1,Uncertain:2}[j.ng_confidence]??2),lowKnownPay=j=>salaryMax(j)>0&&salaryMax(j)<200000;
function baseEligible(j){return j.status==="Open"&&j.citizenship_required!=="Yes"&&j.sponsorship!=="No"&&j.ng_confidence!=="Not NG"}function applyNow(j){return baseEligible(j)&&aiUrls.has(urlKey(j.url))}function stretchNow(j){return baseEligible(j)&&j.is_stretch===true}
function latestCompare(a,b){return posted(b).localeCompare(posted(a))||ngRank(a)-ngRank(b)||Number(phd(a))-Number(phd(b))||Number(lowKnownPay(a))-Number(lowKnownPay(b))||num(b.personalized_score)-num(a.personalized_score)||salaryMax(b)-salaryMax(a)||String(a.company).localeCompare(String(b.company))}const fitCompare=(a,b)=>num(b.personalized_score)-num(a.personalized_score)||latestCompare(a,b),salaryCompare=(a,b)=>salaryMax(b)-salaryMax(a)||latestCompare(a,b);
