name: Google Jobs daily discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "43 8 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/google-jobs-daily.yml"
      - "scripts/**"
      - "config/**"

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  google-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: env.SERPAPI_KEY != ''
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: env.SERPAPI_KEY != ''
        run: python -m pip install -r requirements.txt

      - name: Validate collector runtime
        id: validate
        if: env.SERPAPI_KEY != ''
        run: |
          python -m py_compile \
            scripts/update_jobs.py scripts/extra_discovery.py scripts/order_jobs.py \
            scripts/pipeline_runner.py scripts/profile_ranker.py \
            scripts/smart_rank_jobs.py scripts/smoke_test.py
          python scripts/smoke_test.py

      - name: Discover Google Jobs
        id: google_discovery
        if: env.SERPAPI_KEY != ''
        continue-on-error: true
        run: python scripts/pipeline_runner.py extra --workers 5 --max-detail-pages 120 --skip-github

      - name: Apply new-grad qualification and rebuild review queue
        id: postprocess
        if: env.SERPAPI_KEY != '' && steps.google_discovery.outcome == 'success'
        run: |
          python scripts/order_jobs.py
          python scripts/smart_rank_jobs.py --max-detail-pages 80

      - name: Record Google Jobs status
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          DISCOVERY_OUTCOME: ${{ steps.google_discovery.outcome }}
          POSTPROCESS_OUTCOME: ${{ steps.postprocess.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          configured = bool(os.environ.get("SERPAPI_KEY", "").strip())
          status = {
              "configured": configured,
              "validation_outcome": os.environ.get("VALIDATE_OUTCOME", "skipped"),
              "discovery_outcome": os.environ.get("DISCOVERY_OUTCOME", "skipped"),
              "postprocess_outcome": os.environ.get("POSTPROCESS_OUTCOME", "skipped"),
              "checked_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "note": "Google/SerpAPI is an optional discovery source; its failure does not fail the main job pipeline.",
          }
          Path("data").mkdir(exist_ok=True)
          Path("data/google_jobs_status.json").write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          print(status)
          PY

      - name: Commit Google discovery changes and status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md data
          if git diff --cached --quiet; then
            echo "No Google Jobs changes."
            exit 0
          fi
          git commit -m "chore: refresh optional Google Jobs discovery"
          git pull --rebase origin main
          git push origin HEAD:main
