name: Google Jobs daily discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "43 8 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/google-jobs-daily.yml"

permissions:
  contents: write

concurrency:
  group: google-jobs-daily
  cancel-in-progress: true

jobs:
  google-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        if: env.SERPAPI_KEY != ''
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: env.SERPAPI_KEY != ''
        run: python -m pip install -r requirements.txt

      - name: Validate collector runtime
        id: validate
        if: env.SERPAPI_KEY != ''
        run: |
          python -m py_compile \
            scripts/update_jobs.py scripts/extra_discovery.py scripts/order_jobs.py \
            scripts/pipeline_runner.py scripts/profile_ranker.py \
            scripts/smart_rank_jobs.py scripts/smoke_test.py \
            scripts/reconcile_tracker_updates.py
          python scripts/smoke_test.py

      - name: Discover Google Jobs
        id: google_discovery
        if: env.SERPAPI_KEY != ''
        continue-on-error: true
        run: python scripts/pipeline_runner.py extra --workers 5 --max-detail-pages 120 --skip-github

      - name: Apply qualification, tracker updates, and rebuild review queue
        id: postprocess
        if: env.SERPAPI_KEY != '' && steps.google_discovery.outcome == 'success'
        run: |
          python scripts/order_jobs.py
          python scripts/reconcile_tracker_updates.py
          python scripts/smart_rank_jobs.py --max-detail-pages 80

      - name: Record Google Jobs status
        if: always()
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          DISCOVERY_OUTCOME: ${{ steps.google_discovery.outcome }}
          POSTPROCESS_OUTCOME: ${{ steps.postprocess.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          configured = bool(os.environ.get("SERPAPI_KEY", "").strip())
          status = {
              "configured": configured,
              "validation_outcome": os.environ.get("VALIDATE_OUTCOME", "skipped"),
              "discovery_outcome": os.environ.get("DISCOVERY_OUTCOME", "skipped"),
              "postprocess_outcome": os.environ.get("POSTPROCESS_OUTCOME", "skipped"),
              "checked_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "note": "Google/SerpAPI is an optional discovery source; its failure does not fail the main job pipeline.",
          }
          Path("data").mkdir(exist_ok=True)
          Path("data/google_jobs_status.json").write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          print(status)
          PY

      - name: Commit Google discovery changes and status
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          OUT="$RUNNER_TEMP/google-jobs-output"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp README.md "$OUT/"
          cp -a data "$OUT/data"

          for attempt in 1 2 3; do
            git fetch origin main

            # Never replace the human-reviewed Apply Now shortlist with a stale
            # copy from this long-running discovery job.
            MANUAL_AI="$RUNNER_TEMP/ai_recommendations.json"
            rm -f "$MANUAL_AI"
            git show origin/main:data/ai_recommendations.json > "$MANUAL_AI" 2>/dev/null || true

            git reset --hard origin/main
            cp "$OUT/README.md" README.md
            rm -rf data
            cp -a "$OUT/data" data
            if [ -s "$MANUAL_AI" ]; then
              cp "$MANUAL_AI" data/ai_recommendations.json
            fi
            git add -A -- README.md data

            if git diff --cached --quiet; then
              echo "No Google Jobs changes after syncing latest main."
              exit 0
            fi

            git commit -m "chore: refresh optional Google Jobs discovery"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another writer; retrying on latest main (attempt $attempt/3)."
          done

          echo "Unable to publish Google discovery outputs after 3 attempts."
          exit 1
