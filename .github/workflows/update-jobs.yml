name: Update jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/update-jobs.yml"

permissions:
  contents: write

concurrency:
  group: update-jobs-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        id: validate
        run: |
          python -m py_compile \
            scripts/update_jobs.py scripts/extra_discovery.py \
            scripts/bigtech_discovery.py scripts/final_guard.py \
            scripts/order_jobs.py scripts/china_discovery.py \
            scripts/pipeline_runner.py scripts/profile_ranker.py \
            scripts/smart_rank_jobs.py scripts/smoke_test.py \
            scripts/reconcile_tracker_updates.py

      - name: Runtime smoke test
        id: smoke
        run: python scripts/smoke_test.py

      - name: Discover and enrich jobs
        id: primary
        continue-on-error: true
        run: python scripts/pipeline_runner.py update --workers 6 --max-detail-pages 120

      - name: Discover official big-tech roles
        id: bigtech
        continue-on-error: true
        run: python scripts/bigtech_discovery.py

      - name: Discover from expanded GitHub lists
        id: extra
        continue-on-error: true
        run: python scripts/pipeline_runner.py extra --workers 6 --max-detail-pages 120 --skip-google

      - name: Remove internships fellowships and special programs
        id: guard
        run: python scripts/final_guard.py

      - name: Qualify new-grad roles and apply eligibility filters
        id: qualify
        run: python scripts/order_jobs.py

      - name: Reconcile reviewed Gmail application status updates
        id: tracker
        run: python scripts/reconcile_tracker_updates.py

      - name: Build resume-aware semantic-review queue
        id: review_queue
        run: python scripts/smart_rank_jobs.py --max-detail-pages 80

      - name: Discover high-value China roles
        id: china
        continue-on-error: true
        run: python scripts/china_discovery.py

      - name: Record pipeline status
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          VALIDATE: ${{ steps.validate.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          PRIMARY: ${{ steps.primary.outcome }}
          BIGTECH: ${{ steps.bigtech.outcome }}
          EXTRA: ${{ steps.extra.outcome }}
          GUARD: ${{ steps.guard.outcome }}
          QUALIFY: ${{ steps.qualify.outcome }}
          TRACKER: ${{ steps.tracker.outcome }}
          REVIEW_QUEUE: ${{ steps.review_queue.outcome }}
          CHINA: ${{ steps.china.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          stages = {
              "validate": os.environ.get("VALIDATE", "skipped"),
              "smoke": os.environ.get("SMOKE", "skipped"),
              "primary_discovery": os.environ.get("PRIMARY", "skipped"),
              "bigtech_discovery": os.environ.get("BIGTECH", "skipped"),
              "extra_discovery": os.environ.get("EXTRA", "skipped"),
              "final_guard": os.environ.get("GUARD", "skipped"),
              "qualification": os.environ.get("QUALIFY", "skipped"),
              "tracker_reconciliation": os.environ.get("TRACKER", "skipped"),
              "review_queue": os.environ.get("REVIEW_QUEUE", "skipped"),
              "china_discovery": os.environ.get("CHINA", "skipped"),
          }
          critical = ["validate", "smoke", "final_guard", "qualification", "tracker_reconciliation", "review_queue"]
          warnings = [k for k, v in stages.items() if v == "failure" and k not in critical]
          failed = [k for k in critical if stages.get(k) == "failure"]
          cancelled = [k for k, v in stages.items() if v == "cancelled"]
          incomplete = [k for k in critical if stages.get(k) not in {"success", "failure"}]
          if cancelled:
              overall = "cancelled"
          elif failed or incomplete:
              overall = "failure"
          elif warnings:
              overall = "warning"
          else:
              overall = "success"
          status = {
              "source_sha": os.environ.get("SOURCE_SHA", ""),
              "checked_at_utc": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "overall": overall,
              "critical_failures": failed,
              "incomplete_critical_stages": incomplete,
              "cancelled_stages": cancelled,
              "warnings": warnings,
              "stages": stages,
          }
          Path("data").mkdir(exist_ok=True)
          Path("data/pipeline_status.json").write_text(json.dumps(status, indent=2) + "\n", encoding="utf-8")
          print(status)
          PY

      - name: Commit changes and diagnostics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve this run's generated outputs. If another run pushed while this
          # one was working, replay these bot-owned outputs on top of the latest main
          # instead of rebasing generated files and producing merge conflicts.
          OUT="$RUNNER_TEMP/job-pipeline-output"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp README.md CHINA.md "$OUT"/
          cp -a data "$OUT/data"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$OUT/README.md" README.md
            cp "$OUT/CHINA.md" CHINA.md
            rm -rf data
            cp -a "$OUT/data" data
            git add -A -- README.md CHINA.md data

            if git diff --cached --quiet; then
              echo "No changes after syncing latest main."
              exit 0
            fi

            git commit -m "chore: update 2027 jobs and pipeline status"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another writer; retrying on latest main (attempt $attempt/3)."
          done

          echo "Unable to publish generated outputs after 3 attempts."
          exit 1

      - name: Fail only on critical local pipeline errors
        if: always()
        env:
          VALIDATE: ${{ steps.validate.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          GUARD: ${{ steps.guard.outcome }}
          QUALIFY: ${{ steps.qualify.outcome }}
          TRACKER: ${{ steps.tracker.outcome }}
          REVIEW_QUEUE: ${{ steps.review_queue.outcome }}
        run: |
          for value in "$VALIDATE" "$SMOKE" "$GUARD" "$QUALIFY" "$TRACKER" "$REVIEW_QUEUE"; do
            if [ "$value" = "failure" ]; then
              exit 1
            fi
          done
