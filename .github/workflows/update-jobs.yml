name: Update jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/update-jobs.yml"

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile \
            scripts/update_jobs.py scripts/extra_discovery.py \
            scripts/bigtech_discovery.py scripts/final_guard.py \
            scripts/order_jobs.py scripts/china_discovery.py \
            scripts/pipeline_runner.py scripts/profile_ranker.py \
            scripts/smart_rank_jobs.py scripts/smoke_test.py

      - name: Runtime smoke test
        run: python scripts/smoke_test.py

      - name: Discover and enrich jobs
        run: python scripts/pipeline_runner.py update --workers 6 --max-detail-pages 300

      - name: Discover official big-tech roles
        run: python scripts/bigtech_discovery.py

      - name: Discover from expanded GitHub lists
        run: python scripts/pipeline_runner.py extra --workers 6 --max-detail-pages 250 --skip-google

      - name: Remove internships fellowships and special programs
        run: python scripts/final_guard.py

      - name: Qualify new-grad roles and apply eligibility filters
        run: python scripts/order_jobs.py

      - name: Resume-aware rerank and Apply-Now shortlist
        run: python scripts/smart_rank_jobs.py --max-detail-pages 120

      - name: Discover high-value China roles
        run: python scripts/china_discovery.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189823+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md CHINA.md data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update and smart-rank 2027 new-grad jobs"
          git pull --rebase origin main
          git push origin HEAD:main
